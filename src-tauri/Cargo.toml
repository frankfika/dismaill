[package]
name = "dismail"
version = "1.0.0"
description = "Aura - Decentralized AI Email Client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dismail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# Email: IMAP + SMTP + MIME
async-imap = "0.10"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-parser = "0.9"

# Database (FTS5 ships with the bundled SQLite, no separate feature flag)
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "blob", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Crypto: AES-GCM with 16-byte nonce (compat with existing Electron data)
aes-gcm = { version = "0.10", features = ["aes"] }
typenum = "1.17"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"

# Serde + errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# HTTP / AI streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
once_cell = "1"
regex = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
